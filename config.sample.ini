[general]
# Seconds without data before a device is shown as disconnected
timeout = 30

[mqtt]
host = 192.168.1.10
port = 1883
# Leave username/password empty for anonymous access
username = venus-meters
password = changeme
client_id = venus-mqtt-meters

[shelly]
# Shelly Pro 3EM topic prefix; reads <prefix>/status/em:0 and <prefix>/status/emdata:0
topic_prefix = shellypro3em-aabbccddeeff

[opendtu]
# OpenDTU MQTT base topic; reads <prefix>/<serial>/0/... and <prefix>/<serial>/status/...
topic_prefix = solar
# Battery-fed inverters (OpenDTU-OnBattery): also publish each inverter's DC input as a
# com.victronenergy.dcsystem, so DVCC raises the MPPT limit by that load (can be set per inverter)
dc_load = no
# Multiply the measured DC power by this (0 < factor <= 1)
dc_load_factor = 1.0
# Seconds without a fresh DC reading before the DC load is cleared (counts as 0 A for DVCC)
dc_load_timeout = 15

# One section per inverter, named inverter:<serial>
[inverter:112233445566]
name = Hoymiles HMS-800-T2 #1
# Phase only affects the per-phase split, totals are correct either way
phase = L1
max_power = 800

[inverter:112233445577]
name = Hoymiles HMS-800-T2 #2
phase = L1
max_power = 800
